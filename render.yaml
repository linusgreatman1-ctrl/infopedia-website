# No `databases:` block here on purpose: Render's free tier allows only one
# active free Postgres instance per account, and this account's is already
# used by another service. Infopedia's database is a separate free Postgres
# project on Supabase instead — DATABASE_URL is a manually-managed secret
# below (its session-pooler connection string; the transaction-pooler one
# hangs indefinitely on `prisma migrate deploy`, and the direct connection
# host isn't reachable from Render's network).
services:
  - type: web
    name: infopedia-website
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
